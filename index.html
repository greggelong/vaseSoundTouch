<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>JingDeZhen· 纸箱里的海</title>
  <style>
    :root {
      --paper: #d4b48c;
      --paper-dim: #8a6a44;
      --sea: #5fd0c8;
      --deep: #0a0c0e;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    html,
    body {
      height: 100%;
      background: var(--deep);
      overflow: hidden;
      font-family: "Courier New", monospace;
      color: var(--paper);
    }

    canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    video {
      display: none;
    }

    #hud {
      position: fixed;
      top: 16px;
      left: 18px;
      z-index: 20;
      pointer-events: none;
      line-height: 1.5;
    }

    #hud .title {
      font-size: 13px;
      letter-spacing: 3px;
      color: #e8d5b0;
    }

    #hud .cn {
      font-size: 12px;
      opacity: 0.65;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      letter-spacing: 2px;
    }

    #status {
      position: fixed;
      bottom: 16px;
      left: 18px;
      z-index: 20;
      background: rgba(10, 8, 6, 0.72);
      border-left: 3px solid var(--paper-dim);
      border-radius: 30px;
      padding: 8px 18px;
      font-size: 12px;
      line-height: 1.7;
      backdrop-filter: blur(6px);
      pointer-events: none;
      max-width: 60vw;
    }

    #status .cn {
      display: block;
      font-size: 11px;
      opacity: 0.7;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    #panel {
      position: fixed;
      bottom: 16px;
      right: 18px;
      z-index: 20;
      background: rgba(10, 8, 6, 0.72);
      border-radius: 14px;
      padding: 10px 14px;
      backdrop-filter: blur(6px);
      font-size: 11px;
      line-height: 1.9;
      width: 190px;
    }

    #panel .row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #panel label {
      flex: 0 0 62px;
      opacity: 0.75;
      font-size: 10px;
      letter-spacing: 0.5px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 2px;
      background: rgba(201, 168, 124, 0.35);
      outline: none;
      border-radius: 2px;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--paper);
      cursor: pointer;
    }

    input[type="range"]::-moz-range-thumb {
      width: 11px;
      height: 11px;
      border: none;
      border-radius: 50%;
      background: var(--paper);
      cursor: pointer;
    }

    #panel .toggles {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    .tbtn {
      flex: 1;
      background: transparent;
      border: 1px solid rgba(201, 168, 124, 0.35);
      color: var(--paper);
      font-family: inherit;
      font-size: 10px;
      padding: 4px 0;
      border-radius: 20px;
      cursor: pointer;
      opacity: 0.55;
      transition: 0.2s;
    }

    .tbtn.on {
      opacity: 1;
      border-color: var(--sea);
      color: var(--sea);
    }

    #debug {
      position: fixed;
      top: 16px;
      right: 18px;
      z-index: 20;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 10px;
      line-height: 1.6;
      color: #aac9b0;
      white-space: pre;
      pointer-events: none;
      display: none;
    }

    #overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: radial-gradient(ellipse at 50% 45%,
          #16211f 0%,
          #08090a 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: opacity 0.8s;
    }

    #overlay.hide {
      opacity: 0;
      pointer-events: none;
    }

    #overlay h1 {
      font-size: clamp(22px, 4vw, 40px);
      letter-spacing: 8px;
      font-weight: normal;
      color: #e8d5b0;
    }

    #overlay .cn-title {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      font-size: clamp(14px, 2vw, 19px);
      letter-spacing: 6px;
      opacity: 0.7;
      margin-top: 10px;
    }

    #overlay .sub {
      font-size: 11px;
      letter-spacing: 2px;
      opacity: 0.45;
      margin-top: 26px;
      line-height: 2;
    }

    #beginBtn {
      margin-top: 34px;
      background: transparent;
      border: 1px solid rgba(95, 208, 200, 0.55);
      color: var(--sea);
      font-family: inherit;
      font-size: 13px;
      letter-spacing: 3px;
      padding: 13px 34px;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.3s;
    }

    #beginBtn:hover {
      background: rgba(95, 208, 200, 0.1);
      border-color: var(--sea);
    }

    #overlay .tiny {
      font-size: 10px;
      opacity: 0.3;
      margin-top: 22px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>
  <canvas id="canvas"></canvas>
  <video id="video" playsinline autoplay muted></video>

  <div id="hud">
    <div class="title">JingDeZhen</div>
    <div class="cn">景德镇 · 七个感应器</div>
  </div>

  <div id="status">
    <span id="statusText">loading hand tracking …</span>
    <span class="cn" id="statusCn">正在加载手势识别 …</span>
  </div>

  <div id="panel">
    <div class="row">
      <label>SENS 灵敏</label>
      <input type="range" id="sens" min="0.2" max="3" step="0.05" value="1" />
    </div>
    <div class="row">
      <label>VOL 音量</label>
      <input type="range" id="vol" min="0" max="1" step="0.02" value="0.9" />
    </div>
    <div class="toggles">
      <button class="tbtn on" id="tVideo">CAM</button>
      <button class="tbtn" id="tDebug">DBG</button>
    </div>
  </div>

  <div id="debug"></div>

  <div id="overlay">
    <div>
      <h1>JingDeZhen</h1>
      <div class="cn-title">景德镇</div>
      <div class="sub">
        seven sensors · seven sounds<br />
        <span style="
              font-family:
                &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif;
            ">
          move your fingertip over a vase<br />用手指尖触碰瓶子
        </span>
      </div>
      <button id="beginBtn">▶ BEGIN / 开始</button>
      <div class="tiny">camera + sound · 需要摄像头与声音</div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

  <script type="importmap">
      {
        "imports": {
          "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.17/vision_bundle.mjs"
        }
      }
    </script>

  <script type="module">
    import { HandLandmarker, FilesetResolver } from "@mediapipe/tasks-vision";

    /* ========================================================
         CONFIG — 在这里改
         ======================================================== */
    const N = 7;
    const FILES = Array.from({ length: N }, (_, i) => `sound${i + 1}.mp3`);
    const LABELS = ["01", "02", "03", "04", "05", "06", "07"];
    const VOICES_PER_SOUND = 3;

    const MAX_HANDS = 4; // how many hands MediaPipe will look for

    const MIN_COOLDOWN = 600;
    const MAX_COOLDOWN = 2600;

    /* ========================================================
         CHAIR IMAGE CONFIG
         ======================================================== */
    const CHAIR_IMG = new Image();
    CHAIR_IMG.src = "vase.png";
    let chairLoaded = false;
    CHAIR_IMG.onload = () => {
      chairLoaded = true;
    };
    CHAIR_IMG.onerror = () => {
      console.warn("chair.png not found — using fallback");
    };

    /* ========================================================
         STATE
         ======================================================== */
    let W = 0,
      H = 0;
    let sensitivity = 1.0;
    let masterVol = 0.9;
    let showVideo = true;
    let showDebug = false;

    let started = false;
    let cameraOK = false;

    const flash = new Array(N).fill(0);
    const cooldownUntil = new Array(N).fill(0);
    const durations = new Array(N).fill(0);
    const ripples = [];
    const pops = [];

    let handLandmarker = null;
    let hands = []; // array of landmark arrays, one per detected hand this frame

    /* ========================================================
         AUDIO — plays mp3 files only
         ======================================================== */
    const voices = [];
    const vIdx = new Array(N).fill(0);
    const missing = new Set();

    for (let i = 0; i < N; i++) {
      const pool = [];
      for (let v = 0; v < VOICES_PER_SOUND; v++) {
        const a = new Audio();
        a.preload = "auto";
        a.src = FILES[i];
        a.addEventListener("loadedmetadata", () => {
          if (isFinite(a.duration)) durations[i] = a.duration;
        });
        a.addEventListener("error", () => missing.add(i));
        pool.push(a);
      }
      voices.push(pool);
    }

    function playSound(i) {
      const pool = voices[i];
      const a = pool[vIdx[i] % pool.length];
      vIdx[i]++;
      a.volume = Math.max(0, Math.min(1, masterVol));
      try {
        a.currentTime = 0;
      } catch (e) { }
      const p = a.play();
      if (p && p.catch) p.catch(() => { });
    }

    function trigger(i) {
      const now = performance.now();
      if (now < cooldownUntil[i]) return;

      const d =
        durations[i] > 0 && isFinite(durations[i])
          ? durations[i] * 1000
          : 1200;
      cooldownUntil[i] =
        now + Math.max(MIN_COOLDOWN, Math.min(d + 120, MAX_COOLDOWN));

      playSound(i);
      flash[i] = 1;
      ripples.push({ c: i, t: 0 });
      pops.push({ c: i, t: 0 });
      if (ripples.length > 60) ripples.shift();
      if (pops.length > 20) pops.shift();
    }

    /* ========================================================
         CANVAS
         ======================================================== */
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + "px";
      canvas.style.height = H + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resize);
    resize();

    /* --------------------------------------------------------
         Geometry for CHAIR instead of cylinder
         Returns { cx, cy, w, h } for the image bounds
         -------------------------------------------------------- */
    function geom(c) {
      const colW = W / N;
      const cx = (c + 0.5) * colW;

      // Use a square-ish size relative to column width and screen height
      const baseSize = Math.min(colW * 0.88, H * 0.38);
      const w = baseSize;
      const h = baseSize * 1.1; // slightly taller than wide (chair-like)

      // Position: bottom of image at 82% of height, centered vertically
      const bottom = H * 0.82;
      const cy = bottom - h / 2;

      return { cx, cy, w, h, colW, bottom };
    }

    /* ========================================================
         CAMERA + MEDIAPIPE HAND LANDMARKER
         ======================================================== */
    const video = document.getElementById("video");

    async function startCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
        return false;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user",
            width: { ideal: 960 },
            height: { ideal: 720 },
          },
          audio: false,
        });
        video.srcObject = stream;
        await video.play();
        cameraOK = true;
        return true;
      } catch (e) {
        console.warn("camera:", e);
        cameraOK = false;
        return false;
      }
    }

    async function initHandLandmarker() {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.17/wasm",
      );
      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate: "GPU",
        },
        runningMode: "VIDEO",
        numHands: MAX_HANDS,
      });
    }

    let lastVideoTime = -1;

    /* No tracking, no identity, no memory — just whatever hands are
       visible in the current frame. */
    function detectHand() {
      if (!handLandmarker || !cameraOK || video.readyState < 2) return;
      if (video.currentTime === lastVideoTime) return;
      lastVideoTime = video.currentTime;

      const res = handLandmarker.detectForVideo(video, performance.now());
      hands = res && res.landmarks ? res.landmarks : [];
    }

    /* ========================================================
         HAND → COLUMN TRIGGER
         ======================================================== */
    const SKELETON = [
      [0, 1],
      [1, 2],
      [2, 3],
      [3, 4], // thumb
      [0, 5],
      [5, 6],
      [6, 7],
      [7, 8], // index
      [5, 9],
      [9, 10],
      [10, 11],
      [11, 12], // middle
      [9, 13],
      [13, 14],
      [14, 15],
      [15, 16], // ring
      [13, 17],
      [17, 18],
      [18, 19],
      [19, 20], // pinky
      [0, 17],
    ];

    function mirroredX(nx) {
      return 1 - nx;
    }

    function toScreen(lm) {
      return { x: mirroredX(lm.x) * W, y: lm.y * H };
    }

    /* Returns the chair column the index fingertip of one hand is over,
       or -1 if the fingertip is not over any chair. Pure function of the
       current frame — no per-hand state. */
    function handCol(lm) {
      const tip = toScreen(lm[8]);
      const col = Math.max(0, Math.min(N - 1, Math.floor(tip.x / (W / N))));

      const g = geom(col);
      const left = g.cx - g.w / 2;
      const right = g.cx + g.w / 2;
      const top = g.cy - g.h / 2;
      const bottom = g.cy + g.h / 2;

      const insideX = tip.x >= left - 20 && tip.x <= right + 20;
      const insideY = tip.y >= top - 40 && tip.y <= bottom + 40;

      return insideX && insideY ? col : -1;
    }

    function updateHandTrigger() {
      for (const lm of hands) {
        const col = handCol(lm);
        if (col >= 0) trigger(col); // trigger() checks cooldownUntil[col]
      }
    }

    /* ========================================================
         RENDER
         ======================================================== */
    function drawVideoFeed() {
      if (!showVideo || !cameraOK || video.readyState < 2) return;
      ctx.save();
      ctx.translate(W, 0);
      ctx.scale(-1, 1);
      ctx.globalAlpha = 0.42;
      ctx.drawImage(video, 0, 0, W, H);
      ctx.restore();

      ctx.save();
      ctx.globalCompositeOperation = "multiply";
      ctx.fillStyle = "rgba(60,110,125,0.9)";
      ctx.fillRect(0, 0, W, H);
      ctx.restore();

      ctx.save();
      const vg = ctx.createRadialGradient(
        W / 2,
        H / 2,
        Math.min(W, H) * 0.28,
        W / 2,
        H / 2,
        Math.max(W, H) * 0.72,
      );
      vg.addColorStop(0, "rgba(0,0,0,0)");
      vg.addColorStop(1, "rgba(0,0,0,0.72)");
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    function drawHandSkeleton() {
      if (hands.length === 0) return;

      ctx.save();
      ctx.shadowColor = "rgba(95,208,200,0.9)";
      ctx.shadowBlur = 14;

      for (const lm of hands) {
        const pts = lm.map(toScreen);

        ctx.strokeStyle = "rgba(140,240,235,0.95)";
        ctx.lineWidth = 2.4;
        ctx.lineCap = "round";
        for (const [a, b] of SKELETON) {
          ctx.beginPath();
          ctx.moveTo(pts[a].x, pts[a].y);
          ctx.lineTo(pts[b].x, pts[b].y);
          ctx.stroke();
        }

        for (let i = 0; i < pts.length; i++) {
          const r = i === 8 ? 7 : i === 0 ? 6 : 3.6;
          ctx.beginPath();
          ctx.arc(pts[i].x, pts[i].y, r, 0, Math.PI * 2);
          if (i === 8) ctx.fillStyle = "#eafffb";
          else if (i === 0) ctx.fillStyle = "#b8f0ea";
          else ctx.fillStyle = "rgba(95,208,200,0.85)";
          ctx.fill();
        }
      }

      // Dashed vertical guide under each hand currently over a chair
      ctx.strokeStyle = "rgba(95,208,200,0.45)";
      ctx.lineWidth = 1;
      ctx.setLineDash([6, 8]);
      for (const lm of hands) {
        const col = handCol(lm);
        if (col < 0) continue;
        const g = geom(col);
        ctx.beginPath();
        ctx.moveTo(g.cx, g.cy - g.h / 2);
        ctx.lineTo(g.cx, g.cy + g.h / 2);
        ctx.stroke();
      }
      ctx.setLineDash([]);

      ctx.restore();
    }

    /* --------------------------------------------------------
         DRAW CHAIR
         -------------------------------------------------------- */
    function drawChair(c) {
      const g = geom(c);
      const f = flash[c];
      const isHover = hands.some((lm) => handCol(lm) === c);
      const lit = Math.max(f, isHover ? 0.35 : 0);

      const left = g.cx - g.w / 2;
      const top = g.cy - g.h / 2;

      // Glow behind the chair when lit
      if (lit > 0.01) {
        const gy = g.cy;
        const rad = Math.max(g.w, g.h) * 1.8;
        const grd = ctx.createRadialGradient(g.cx, gy, 0, g.cx, gy, rad);
        grd.addColorStop(0, `rgba(95,208,200,${0.3 * lit})`);
        grd.addColorStop(0.45, `rgba(60,140,170,${0.12 * lit})`);
        grd.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = grd;
        ctx.fillRect(g.cx - rad, gy - rad, rad * 2, rad * 2);
      }

      if (chairLoaded) {
        // Draw the actual PNG
        ctx.save();
        ctx.shadowColor = "rgba(0,0,0,0.6)";
        ctx.shadowBlur = 20 * (0.5 + lit * 0.5);
        ctx.shadowOffsetY = 6;

        ctx.drawImage(CHAIR_IMG, left, top, g.w, g.h);

        if (lit > 0.01) {
          ctx.shadowColor = "transparent";
          ctx.globalCompositeOperation = "screen";
          ctx.globalAlpha = 0.25 * lit;
          ctx.drawImage(CHAIR_IMG, left, top, g.w, g.h);
          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = "source-over";

          ctx.beginPath();
          ctx.rect(left - 2, top - 2, g.w + 4, g.h + 4);
          ctx.strokeStyle = `rgba(95,208,200,${0.5 * lit})`;
          ctx.lineWidth = 2;
          ctx.stroke();
        }
        ctx.restore();
      } else {
        // Fallback: simple rectangle if image fails to load
        ctx.save();
        const grad = ctx.createLinearGradient(
          left,
          top,
          left + g.w,
          top + g.h,
        );
        grad.addColorStop(0, "#3d2e1d");
        grad.addColorStop(0.5, "#9c7846");
        grad.addColorStop(1, "#33261a");
        ctx.fillStyle = grad;
        ctx.fillRect(left, top, g.w, g.h);
        ctx.strokeStyle = `rgba(201,168,124,${0.4 + 0.5 * lit})`;
        ctx.lineWidth = 2;
        ctx.strokeRect(left, top, g.w, g.h);
        ctx.restore();
      }

      // Label under the chair
      ctx.textAlign = "center";
      ctx.font = '12px "Courier New", monospace';
      ctx.fillStyle = `rgba(212,180,140,${0.3 + 0.6 * lit})`;
      ctx.fillText(LABELS[c], g.cx, g.cy + g.h / 2 + 24);
    }

    function drawRipples(dt) {
      for (let i = ripples.length - 1; i >= 0; i--) {
        const rp = ripples[i];
        rp.t += dt / 850;
        if (rp.t >= 1) {
          ripples.splice(i, 1);
          continue;
        }
        const g = geom(rp.c);
        const rr = g.w * (0.55 + rp.t * 1.6);
        ctx.beginPath();
        ctx.ellipse(g.cx, g.cy, rr, rr * 0.5, 0, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(150,245,240,${(1 - rp.t) * 0.45})`;
        ctx.lineWidth = 1.4;
        ctx.stroke();

        const rr2 = rr * 0.68;
        if (rr2 > g.w * 0.6) {
          ctx.beginPath();
          ctx.ellipse(g.cx, g.cy, rr2, rr2 * 0.5, 0, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(150,245,240,${(1 - rp.t) * 0.22})`;
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    }

    function drawPops(dt) {
      for (let i = pops.length - 1; i >= 0; i--) {
        const p = pops[i];
        p.t += dt / 900;
        if (p.t >= 1) {
          pops.splice(i, 1);
          continue;
        }
        const g = geom(p.c);
        const a = (1 - p.t) * Math.min(1, p.t * 6);
        ctx.textAlign = "center";
        ctx.font = 'bold 13px "Courier New", monospace';
        ctx.fillStyle = `rgba(160,250,242,${a})`;
        ctx.fillText(
          "▸ " + LABELS[p.c],
          g.cx,
          g.cy - g.h / 2 - 16 - p.t * 26,
        );
      }
    }

    function drawFloor() {
      const grd = ctx.createLinearGradient(0, H * 0.72, 0, H);
      grd.addColorStop(0, "rgba(0,0,0,0)");
      grd.addColorStop(1, "rgba(0,0,0,0.65)");
      ctx.fillStyle = grd;
      ctx.fillRect(0, H * 0.72, W, H * 0.28);
    }

    /* ========================================================
         LOOP
         ======================================================== */
    let last = performance.now();

    function loop(now) {
      requestAnimationFrame(loop);
      const dt = Math.min(60, now - last);
      last = now;

      detectHand();
      updateHandTrigger();

      for (let c = 0; c < N; c++) {
        flash[c] *= Math.pow(0.94, dt / 16.67);
        if (flash[c] < 0.002) flash[c] = 0;
      }

      ctx.fillStyle = "#0a0c0e";
      ctx.fillRect(0, 0, W, H);

      drawVideoFeed();
      drawFloor();

      for (let c = 0; c < N; c++) drawChair(c);
      drawRipples(dt);
      drawPops(dt);
      drawHandSkeleton();

      if (showDebug) renderDebug();
    }

    function renderDebug() {
      const cols = hands.map((lm) => {
        const c = handCol(lm);
        return c >= 0 ? c + 1 : "—";
      });
      let s = "";
      s += `hands: ${hands.length}\n`;
      s += `cols: ${cols.join(",") || "—"}\n`;
      if (missing.size)
        s += `missing: ${[...missing].map((i) => i + 1).join(",")}`;
      document.getElementById("debug").textContent = s;
    }

    /* ========================================================
         UI
         ======================================================== */
    function setStatus(en, cn) {
      document.getElementById("statusText").textContent = en;
      document.getElementById("statusCn").textContent = cn;
    }

    document.getElementById("sens").addEventListener("input", (e) => {
      sensitivity = parseFloat(e.target.value);
    });

    document.getElementById("vol").addEventListener("input", (e) => {
      masterVol = parseFloat(e.target.value);
    });

    const tVideo = document.getElementById("tVideo");
    tVideo.addEventListener("click", () => {
      showVideo = !showVideo;
      tVideo.classList.toggle("on", showVideo);
    });

    const tDebug = document.getElementById("tDebug");
    tDebug.addEventListener("click", () => {
      showDebug = !showDebug;
      tDebug.classList.toggle("on", showDebug);
      document.getElementById("debug").style.display = showDebug
        ? "block"
        : "none";
    });

    canvas.addEventListener("pointerdown", (ev) => {
      if (!started) return;
      const colW = W / N;
      const c = Math.max(0, Math.min(N - 1, Math.floor(ev.clientX / colW)));
      trigger(c);
    });

    window.addEventListener("keydown", (ev) => {
      const n = parseInt(ev.key, 10);
      if (n >= 1 && n <= N) trigger(n - 1);
    });

    document
      .getElementById("beginBtn")
      .addEventListener("click", async () => {
        started = true;
        document.getElementById("overlay").classList.add("hide");

        const warm = new Audio(FILES[0]);
        warm.volume = 0;
        warm.play().catch(() => { });

        setStatus("starting camera …", "正在启动摄像头 …");
        const ok = await startCamera();

        if (!ok) {
          setStatus(
            "no camera — tap a chair or press 1–7",
            "没有摄像头 — 点击椅子或按 1–7",
          );
          return;
        }

        setStatus("loading hand tracking …", "正在加载手势识别 …");
        try {
          await initHandLandmarker();
          setStatus("move your fingertip over a vase", "用手指尖触碰瓶子");
        } catch (e) {
          console.warn(e);
          setStatus(
            "hand tracking unavailable — tap a vase",
            "手势识别不可用 — 点击瓶子",
          );
        }
      });

    requestAnimationFrame(loop);
  </script>
</body>

</html>
